<section class="hero page-shell">
  <div class="hero-panel">
    <p class="eyebrow">{{ site.Params.hero.eyebrow }}</p>
    <h1>{{ site.Params.hero.title }}</h1>
    <p class="hero-intro">{{ site.Params.hero.intro }}</p>
    <div class="hero-actions">
      <a class="button button-primary" href="{{ site.Params.hero.primaryCtaUrl }}">{{ site.Params.hero.primaryCtaLabel }}</a>
      <a class="button button-secondary" href="{{ site.Params.hero.secondaryCtaUrl }}">{{ site.Params.hero.secondaryCtaLabel }}</a>
    </div>
  </div>
</section>
